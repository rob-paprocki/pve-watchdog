<rect x="10" y="10" width="200" height="310" rx="12" fill="#0d1117" stroke="#3d444d" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="110" y="30" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle" dominant-baseline="middle">pve1</text>
