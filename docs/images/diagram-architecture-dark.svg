<svg xmlns="http://www.w3.org/2000/svg" width="560" height="330" viewBox="0 0 560 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="What runs where: a watchdog and a gatekeeper on each node, the container on pve1, its stopped standby on pve2">
<title>What runs where: a watchdog and a gatekeeper on each node, the container on pve1, its stopped standby on pve2</title>
