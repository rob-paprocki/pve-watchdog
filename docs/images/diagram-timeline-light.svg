<svg xmlns="http://www.w3.org/2000/svg" width="560" height="762" viewBox="0 0 560 762" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="A power cut on pve1: pve2 notices, wakes it, waits, starts the standby, and hands the container back with its data when pve1 is healthy">
<title>A power cut on pve1: pve2 notices, wakes it, waits, starts the standby, and hands the container back with its data when pve1 is healthy</title>
<defs><marker id="a-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0969da"/></marker><marker id="s-arrow" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#0969da"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#59636e"/></marker><marker id="s-muted" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#59636e"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1a7f37"/></marker><marker id="s-ok" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#1a7f37"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#cf222e"/></marker><marker id="s-bad" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#cf222e"/></marker></defs>
<line x1="140" y1="50" x2="140" y2="716" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="80" y="10" width="120" height="36" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="140" y="28" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">pve1</text>
<rect x="80" y="716" width="120" height="36" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="140" y="734" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">pve1</text>
<line x1="420" y1="50" x2="420" y2="716" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="360" y="10" width="120" height="36" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="420" y="28" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">pve2</text>
<rect x="360" y="716" width="120" height="36" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="420" y="734" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">pve2</text>
<rect x="15" y="66" width="250" height="40" rx="8" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
<text x="140" y="86" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">Power cut</text>
<path d="M416 150 L144 150" fill="none" stroke="#59636e" stroke-width="1.8" marker-end="url(#a-muted)"/>
<text x="280" y="136" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle" dominant-baseline="middle">ping, web port, cluster, watchdog</text>
<rect x="295" y="174" width="250" height="40" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="420" y="194" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">No answer for 6 rounds</text>
<path d="M416 258 L144 258" fill="none" stroke="#0969da" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a-arrow)"/>
<text x="280" y="244" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle" dominant-baseline="middle">Wake-on-LAN</text>
<rect x="295" y="282" width="250" height="52" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="420" y="300.8" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">Wait 90 s, then ping and ARP</text>
<text x="420" y="315.2" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">CT 110's own IP</text>
<rect x="295" y="348" width="250" height="52" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="420" y="366.8" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">Nothing answers: start CT 1110</text>
<text x="420" y="381.2" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">(about 3 min in)</text>
<rect x="15" y="414" width="250" height="52" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="140" y="432.8" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">Power back,</text>
<text x="140" y="447.2" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">healthy for 10 min</text>
<rect x="295" y="480" width="250" height="52" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="420" y="498.8" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">Stop CT 1110,</text>
<text x="420" y="513.2" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">take a final backup</text>
<path d="M416 576 L144 576" fill="none" stroke="#0969da" stroke-width="1.8" marker-end="url(#a-arrow)"/>
<text x="280" y="562" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle" dominant-baseline="middle">copy the backup into CT 110</text>
<rect x="15" y="600" width="250" height="40" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="140" y="620" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">Start CT 110</text>
<rect x="295" y="654" width="250" height="40" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="420" y="674" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle" dominant-baseline="middle">CT 1110 is the standby again</text>
</svg>
