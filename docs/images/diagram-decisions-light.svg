<svg xmlns="http://www.w3.org/2000/svg" width="660" height="640" viewBox="0 0 660 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="How a watchdog decides to take over: every check that has to pass before it starts a standby, and where it stops instead">
<title>How a watchdog decides to take over: every check that has to pass before it starts a standby, and where it stops instead</title>
<defs><marker id="a-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0969da"/></marker><marker id="s-arrow" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#0969da"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#59636e"/></marker><marker id="s-muted" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#59636e"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1a7f37"/></marker><marker id="s-ok" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#1a7f37"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#cf222e"/></marker><marker id="s-bad" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#cf222e"/></marker></defs>
<rect x="50" y="20" width="290" height="50" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="195" y="37.2" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">All four checks fail</text>
<text x="195" y="52.8" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">for another node</text>
<rect x="50" y="100" width="290" height="40" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
<text x="195" y="120" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">6 rounds in a row?</text>
<path d="M195 70 L195 98" fill="none" stroke="#0969da" stroke-width="1.8" marker-end="url(#a-arrow)"/>
<path d="M50 120 L32 120 L32 45 L48 45" fill="none" stroke="#0969da" stroke-width="1.8" marker-end="url(#a-arrow)"/>
<text x="46" y="86" font-size="12" font-weight="normal" fill="#59636e" text-anchor="end" dominant-baseline="middle">no</text>
<rect x="50" y="170" width="290" height="50" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="195" y="187.2" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">Wait 90 s</text>
<text x="195" y="202.8" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">(Wake-on-LAN goes out meanwhile)</text>
<path d="M195 140 L195 168" fill="none" stroke="#0969da" stroke-width="1.8" marker-end="url(#a-arrow)"/>
<text x="217" y="155" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle" dominant-baseline="middle">yes</text>
<rect x="50" y="250" width="290" height="40" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
<text x="195" y="270" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">Node back?</text>
<path d="M195 220 L195 248" fill="none" stroke="#0969da" stroke-width="1.8" marker-end="url(#a-arrow)"/>
<rect x="405" y="250" width="245" height="40" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="527.5" y="270" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle" dominant-baseline="middle">Nothing to do</text>
<path d="M340 270 L403 270" fill="none" stroke="#0969da" stroke-width="1.8" marker-end="url(#a-arrow)"/>
<text x="372.5" y="258" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle" dominant-baseline="middle">yes</text>
<rect x="50" y="320" width="290" height="40" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
<text x="195" y="340" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">Gateway reachable?</text>
<path d="M195 290 L195 318" fill="none" stroke="#0969da" stroke-width="1.8" marker-end="url(#a-arrow)"/>
<text x="217" y="305" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle" dominant-baseline="middle">no</text>
<rect x="405" y="315" width="245" height="50" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="527.5" y="332.8" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle" dominant-baseline="middle">This node is the one cut off:</text>
<text x="527.5" y="347.2" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle" dominant-baseline="middle">do nothing</text>
<path d="M340 340 L403 340" fill="none" stroke="#0969da" stroke-width="1.8" marker-end="url(#a-arrow)"/>
<text x="372.5" y="328" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle" dominant-baseline="middle">no</text>
<rect x="50" y="390" width="290" height="50" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
<text x="195" y="407.2" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">Container's own IP answers</text>
<text x="195" y="422.8" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">ping or ARP?</text>
<path d="M195 360 L195 388" fill="none" stroke="#0969da" stroke-width="1.8" marker-end="url(#a-arrow)"/>
<text x="217" y="375" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle" dominant-baseline="middle">yes</text>
<rect x="405" y="395" width="245" height="40" rx="8" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
<text x="527.5" y="415" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">Abort and alert</text>
<path d="M340 415 L403 415" fill="none" stroke="#0969da" stroke-width="1.8" marker-end="url(#a-arrow)"/>
<text x="372.5" y="403" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle" dominant-baseline="middle">yes</text>
<rect x="50" y="470" width="290" height="40" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
<text x="195" y="490" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">Quorum on its own?</text>
<path d="M195 440 L195 468" fill="none" stroke="#0969da" stroke-width="1.8" marker-end="url(#a-arrow)"/>
<text x="217" y="455" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle" dominant-baseline="middle">no</text>
<rect x="405" y="465" width="245" height="50" rx="8" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
<text x="527.5" y="482.8" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">pvecm expected 1</text>
<text x="527.5" y="497.2" font-size="12" font-weight="normal" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">(force mode, loud alert)</text>
<path d="M340 490 L403 490" fill="none" stroke="#0969da" stroke-width="1.8" marker-end="url(#a-arrow)"/>
<text x="372.5" y="478" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle" dominant-baseline="middle">no</text>
<rect x="50" y="570" width="290" height="50" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="195" y="587.2" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">Check the IP once more,</text>
<text x="195" y="602.8" font-size="13" font-weight="normal" fill="#1f2328" text-anchor="middle" dominant-baseline="middle">start the standby</text>
<path d="M195 510 L195 568" fill="none" stroke="#0969da" stroke-width="1.8" marker-end="url(#a-arrow)"/>
<text x="217" y="540" font-size="12" font-weight="normal" fill="#59636e" text-anchor="middle" dominant-baseline="middle">yes</text>
<path d="M527.5 520 L527.5 595 L342 595" fill="none" stroke="#0969da" stroke-width="1.8" marker-end="url(#a-arrow)"/>
</svg>
