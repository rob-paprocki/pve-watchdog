name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Unit tests
        run: PYTHONPATH=controller python3 -m unittest discover -s tests -v
      - name: Personal-value check (emails, IPs, MACs)
        run: python3 tests/check_repo.py
      - name: Shell syntax
        run: bash -n install.sh && bash -n get.sh

  changelog:
    # Flag visible changes that have no changelog line.
    if: endsWith(github.repository, '-private')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Changelog check
        run: python3 scripts/release/changelog_check.py
